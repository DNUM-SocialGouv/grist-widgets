<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban DSFR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/icons/icons.min.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden;
         background: var(--background-alt-grey, #f6f6f6); color: var(--text-default-grey, #3a3a3a); }
  .kb-bar { display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem; background: #fff;
            border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-bar .kb-title { font-weight: 700; font-size: 1rem; color: var(--text-title-grey, #161616); margin: 0; }
  .kb-bar .kb-spacer { flex: 1; }
  .kb-bar input[type=search] { max-width: 260px; }
  .kb-board { flex: 1; overflow: auto; display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }
  .kb-empty { margin: auto; text-align: center; padding: 2rem; }

  .kb-col { flex: 0 0 290px; max-height: 100%; display: flex; flex-direction: column; border-radius: 4px;
            background: var(--col-bg); border-top: 4px solid var(--col-bar); position: relative; }
  .kb-col-head { display: flex; align-items: center; gap: .5rem; padding: .625rem .75rem; }
  .kb-col-body { padding-bottom: .75rem !important; }
  .kb-modal-head input.fr-input { font-size: 1.125rem; font-weight: 700; flex: 1; }
  .kb-col-name { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 color: var(--text-title-grey, #161616); }
  .kb-count { background: #fff; border-radius: 1rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700; line-height: 1.5rem; }
  .kb-col-body { padding: 0 .5rem .5rem; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; min-height: 3rem; flex: 1; }
  .kb-col-body.drag-over { outline: 2px dashed var(--col-bar); outline-offset: -4px; border-radius: 4px; }

  .kb-card { background: #fff; border-radius: 4px; padding: .75rem; cursor: grab;
             box-shadow: 0 0 0 1px var(--border-default-grey, #ddd); }
  .kb-card:hover { box-shadow: 0 0 0 1px var(--text-action-high-blue-france, #000091), 0 2px 6px rgba(0,0,0,.12); }
  .kb-card.dragging { opacity: .4; }
  .kb-card-title { margin: 0 0 .25rem; font-size: 1rem; line-height: 1.4; font-weight: 700; color: var(--text-title-grey, #161616); }
  .kb-fields { display: flex; flex-direction: column; gap: .5rem; margin-top: .5rem; font-size: .875rem; }
  .kb-f { display: block; }
  .kb-f-label { color: var(--text-mention-grey, #666); font-size: .75rem; line-height: 1.25rem; }
  .kb-f-val { line-height: 1.5rem; }
  .kb-link { word-break: break-all; }
  .kb-check { width: 1rem; height: 1rem; accent-color: var(--text-action-high-blue-france, #000091); vertical-align: middle; }
  .kb-cell { margin-bottom: 1rem; min-width: 0; position: relative; }
  .kb-cell-label { display: flex; align-items: center; gap: .3rem; font-size: .6875rem; font-weight: 700; color: var(--text-mention-grey, #666); text-transform: uppercase; letter-spacing: .07em; margin-bottom: .25rem; }
  .kb-emoji { font-style: normal; text-transform: none; letter-spacing: 0; }
  .kb-val { font-size: .875rem; line-height: 1.5rem; white-space: pre-wrap; }
  .kb-empty-val { display: inline-block; padding: 1px 8px; background: var(--background-contrast-error, #ffe9e9); border: 1px solid var(--border-default-error, #ce0500); border-radius: 4px; color: var(--text-default-error, #ce0500); font-size: .75rem; font-style: italic; }
  .kb-ro .kb-ic { display: none; }
  .kb-cell { container-type: inline-size; container-name: cell; }
  /* champ étroit (⅓) : l'étiquette « Formule » / « Lecture seule » devient une petite icône pour ne pas coller au champ voisin */
  @container cell (max-width: 280px) { .kb-ro .kb-tx { display: none; } .kb-ro .kb-ic { display: inline; } .kb-ro { padding: 0 4px; } }
  .kb-ro { margin-left: auto; flex-shrink: 0; font-size: .625rem; font-weight: 600; letter-spacing: .05em; color: #929292; background: #f0f0f0; border: 1px solid #ddd; border-radius: 3px; padding: 0 5px; text-transform: uppercase; }
  .kb-info { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; background: #929292; color: #fff; font-size: 9px; font-style: normal; font-weight: 700; letter-spacing: 0; text-transform: none; cursor: default; position: relative; }
  .kb-info:hover, .kb-info:focus { background: #000091; outline: none; }
  .kb-info::after { content: attr(data-tip); display: none; position: absolute; left: 0; top: calc(100% + 6px); width: max-content; max-width: 260px; background: #2b2b2b; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: .75rem; font-weight: 400; line-height: 1.5; text-transform: none; white-space: pre-wrap; z-index: 70; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .kb-info:hover::after, .kb-info:focus::after { display: block; }
  .kb-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .kb-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 10px; font-size: .75rem; line-height: 1.25rem; }
  .kb-x { border: 0; background: none; cursor: pointer; color: inherit; opacity: .7; font-size: .875rem; line-height: 1; padding: 0; }
  .kb-x:hover { opacity: 1; }
  .kb-dd { position: relative; }
  .kb-dd-trigger { display: flex; align-items: center; justify-content: space-between; gap: .5rem; width: 100%; min-height: 2.5rem; padding: .25rem .75rem; background: #eee; border: 0; border-bottom: 2px solid #3a3a3a; border-radius: .25rem .25rem 0 0; cursor: pointer; text-align: left; }
  .kb-chev2 { color: #666; font-size: .75rem; }
  .kb-plus { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #000091; background: var(--background-alt-blue-france, #f5f5fe); color: #000091; font-size: .875rem; line-height: 1; cursor: pointer; padding: 0; }
  .kb-plus:hover { background: #000091; color: #fff; }
  .kb-dd-list { display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 12rem; max-width: 100%; max-height: 14rem; overflow-y: auto; z-index: 60; background: #fff; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 4px; }
  .kb-dd.kb-open > .kb-dd-list, .kb-ref .kb-dd:focus-within > .kb-dd-list { display: block; }
  .kb-dd-item { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 5px 8px; border-radius: 2px; font-size: .8125rem; }
  .kb-dd-item:hover { background: #f6f6f6; }
  .kb-dd-none { padding: 8px 10px; color: #929292; font-size: .75rem; }
  .kb-ref .kb-tags { margin-bottom: .25rem; }
  .kb-numwrap { display: flex; align-items: center; gap: .5rem; }
  .kb-unit { color: #666; font-size: .875rem; }
  .kb-att { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; background: #ececfe; color: #000091; font-size: .75rem; font-weight: 600; }
  .kb-att-name { border: 0; background: none; color: inherit; cursor: pointer; text-decoration: underline; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0; }
  .kb-att-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; }
  .kb-auto { resize: none; overflow: hidden; }
  .kb-opts { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: flex-end; background: var(--background-alt-grey, #f6f6f6); border-radius: 4px; padding: .5rem .75rem; margin: 0 0 .5rem; font-size: .75rem; }
  .kb-opts label { display: flex; flex-direction: column; gap: 2px; }
  .kb-emoji-in { width: 4rem; }
  .kb-emojis { display: flex; flex-wrap: wrap; gap: 2px; flex-basis: 100%; }
  .kb-emoji-btn { border: 1px solid transparent; background: none; cursor: pointer; font-size: 1rem; padding: 2px 4px; border-radius: 4px; }
  .kb-emoji-btn:hover { background: #e3e3fd; }
  .kb-opt-check { flex-direction: row !important; align-items: center; gap: .4rem !important; flex-basis: 100%; }
  .kb-opt-tags { display: flex; align-items: center; gap: .4rem; flex-basis: 100%; }
  .kb-swatch { border: 2px solid transparent; border-radius: 6px; width: 28px; height: 26px; font-size: .6875rem; font-weight: 700; cursor: pointer; }
  .kb-swatch.on { border-color: #161616; }
  .kb-badges { display: flex; flex-wrap: wrap; gap: .25rem; }
  .kb-badge { display: inline-block; border-radius: .25rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700;
              line-height: 1.5rem; text-transform: uppercase; letter-spacing: .02em; }

  .kb-overlay { position: fixed; inset: 0; background: rgba(22,22,22,.64); z-index: 50; display: none;
                align-items: center; justify-content: center; padding: 1rem; }
  .kb-overlay.open { display: flex; }
  .kb-modal { background: #fff; width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 4px; }
  .kb-modal-head { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-modal-head h2 { margin: 0; flex: 1; font-size: 1.25rem; }
  .kb-modal-head { align-items: center; }
  .kb-modal-body { padding: 1rem 1.5rem; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0 1.5rem; align-content: start; flex: 1; }
  .kb-modal-body .fr-input-group { margin-bottom: 1rem; }
  .kb-modal-body > *, .kb-sec-body > * { grid-column: span 3; min-width: 0; }
  .kb-modal-body .kb-full, .kb-sec-body .kb-full { grid-column: 1 / -1; }
  .kb-modal-body .kb-w-third, .kb-sec-body .kb-w-third { grid-column: span 2; }
  .kb-modal-body .kb-w-two, .kb-sec-body .kb-w-two { grid-column: span 4; }
  .kb-wsel { font-size: .75rem; border: 1px solid #ddd; border-radius: 4px; background: #fff; padding: 1px 4px; }
  .kb-modal-foot { padding: 1rem 1.5rem; border-top: 1px solid var(--border-default-grey, #ddd); display: flex; justify-content: flex-end; gap: .75rem; }
  .kb-checks { display: flex; flex-wrap: wrap; gap: .25rem 1rem; max-height: 9rem; overflow-y: auto; }
  .kb-checks label { display: flex; gap: .375rem; align-items: center; font-size: .875rem; }

  .kb-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: #fff; z-index: 40;
               box-shadow: -4px 0 16px rgba(0,0,0,.2); transform: translateX(105%); transition: transform .2s; overflow-y: auto; }
  .kb-drawer.open { transform: none; }
  .kb-drawer section { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-drawer h3 { font-size: .9375rem; margin: 0 0 .75rem; }
  .kb-row { display: flex; gap: .375rem; align-items: center; margin-bottom: .375rem; }
  .kb-row .kb-row-name { flex: 1; font-size: .875rem; overflow: hidden; text-overflow: ellipsis; }
  .kb-row select { width: auto; }
  .kb-row { border-radius: 4px; padding: .125rem .25rem; background: #fff; }
  .kb-grip { cursor: grab; font-size: 1.25rem; line-height: 1; color: var(--text-mention-grey, #666); padding: 0 .25rem; user-select: none; }
  .kb-row:hover .kb-grip { color: var(--text-action-high-blue-france, #000091); }
  .row-dragging { opacity: .4; }
  .drop-before { box-shadow: 0 -3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-after { box-shadow: 0 3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-left { box-shadow: -3px 0 0 var(--text-action-high-blue-france, #000091); }
  .drop-right { box-shadow: 3px 0 0 var(--text-action-high-blue-france, #000091); }

  /* popup : mise en page */
  .kb-heading { margin: .5rem 0 .75rem; font-size: 1.125rem; line-height: 1.5; color: var(--text-title-grey, #161616); }
  .kb-divider { border: 0; border-top: 1px solid var(--border-default-grey, #ddd); margin: .5rem 0 1rem; padding: 0; }
  .kb-section { margin-bottom: 1rem; }
  .kb-sec-title { margin: 0 0 .5rem; font-size: 1rem; line-height: 1.5rem; }
  .kb-sec-toggle { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 0 0 .5rem;
                   font: inherit; font-weight: 700; font-size: 1.0625rem; color: var(--text-title-grey, #161616); }
  .kb-chev { display: inline-block; width: 1.25rem; color: var(--text-action-high-blue-france, #000091); }
  .kb-sec-body { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0 1.5rem; padding: 1rem 1rem 0; border-radius: 4px; background: rgba(0, 0, 145, .05); }
  .kb-section.kb-collapsed .kb-sec-body { display: none; }
  .kb-sec-input, .kb-heading-input { font-weight: 700; margin-bottom: .5rem; }
  .kb-blk { border: 1px dashed transparent; border-radius: 4px; padding: .25rem .375rem 0; margin-bottom: .25rem; }
  .kb-blk:hover { border-color: var(--border-default-grey, #bbb); }
  /* en mode mise en page, le contenu des champs ne capte pas la souris : le bloc entier reste une cible de dépôt (les champs désactivés n'émettent pas d'événements de glisser) */
  .kb-blk:not(.kb-section) > :not(.kb-blk-bar):not(.kb-heading-input):not(.kb-opts):not(.kb-lk-inner) { pointer-events: none; }
  .kb-blk-bar { display: flex; align-items: center; gap: .5rem; font-size: .75rem; color: var(--text-mention-grey, #666); margin-bottom: .25rem; }
  .kb-blk-kind { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-mini { background: #fff; border: 1px solid var(--border-default-grey, #ccc); border-radius: 3px; font-size: .75rem; padding: 0 .5rem; cursor: pointer; line-height: 1.375rem; }
  .kb-mini[aria-pressed="true"], .kb-mini[aria-expanded="true"] { background: #e3e3fd; border-color: var(--text-action-high-blue-france, #000091); }
  .kb-mini .kb-ic { display: none; }
  .kb-blk { container-type: inline-size; container-name: blk; }
  .kb-blk-bar { flex-wrap: wrap; row-gap: .25rem; }
  /* bloc étroit : les boutons de mise en forme passent en icônes seules (le libellé reste en info-bulle) */
  @container blk (max-width: 440px) {
    .kb-blk-bar .kb-tx { display: none; }
    .kb-blk-bar .kb-ic { display: inline; }
    .kb-blk-bar .kb-mini { padding: 0 .4rem; }
    .kb-blk-kind { display: none; }
    .kb-blk-bar { gap: .25rem; }
    .kb-blk-bar .kb-grip { margin-right: auto; }
  }
  .kb-mini:hover { border-color: var(--text-action-high-blue-france, #000091); }
  .kb-dropzone { border: 1px dashed var(--border-default-grey, #bbb); border-radius: 4px; color: var(--text-mention-grey, #888);
                 font-size: .8125rem; text-align: center; padding: .375rem; margin: .25rem 0 .75rem; }
  .kb-dropzone.drop-over, .kb-blk.drop-over, .kb-tf.drop-over { background: #ececfe; border-color: var(--text-action-high-blue-france, #000091); box-shadow: none; }
  .kb-hidden { display: none !important; }
  .kb-palette { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem .5rem; padding: .5rem 1.5rem; background: var(--background-alt-grey, #f6f6f6); border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-pal-label { font-size: .75rem; font-weight: 700; color: var(--text-mention-grey, #666); margin-right: .125rem; }
  .kb-pal-find { position: relative; flex: 1; min-width: 11rem; max-width: 20rem; margin-left: auto; }
  .kb-pop { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 14rem; max-height: 15rem; overflow-y: auto; z-index: 65; background: #fff; border: 1px solid var(--border-default-grey, #ddd); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 4px; }
  .kb-pop.open { display: block; }
  .kb-pop-item { display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 5px 8px; border-radius: 2px; font: inherit; font-size: .8125rem; color: var(--text-default-grey, #3a3a3a); }
  .kb-pop-item[draggable=true] { cursor: grab; }
  .kb-pop-item:hover, .kb-pop-item:focus { background: var(--background-alt-blue-france, #f5f5fe); outline: none; }
  .kb-pop-grip { color: var(--text-mention-grey, #666); }
  .kb-pop-type { margin-left: auto; font-size: .6875rem; color: var(--text-mention-grey, #666); }
  .kb-chip { border: 1px dashed var(--text-action-high-blue-france, #000091); background: #fff; border-radius: 1rem; padding: .125rem .75rem;
             font: inherit; font-size: .8125rem; cursor: grab; color: var(--text-default-grey, #3a3a3a); }
  .kb-chip:hover { background: var(--background-alt-blue-france, #f5f5fe); }
  .kb-chip-el { font-weight: 700; border-style: solid; }
  /* bloc « Table liée » : un modèle de champs répété pour chaque enregistrement lié */
  .kb-lk-body { display: flex; flex-direction: column; gap: .5rem; }
  .kb-lk-title { margin-bottom: .5rem; font-weight: 700; }
  .kb-lk-title .kb-val { font-weight: 700; }
  .kb-lk-cfg { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .5rem 1rem; margin-bottom: .5rem; font-size: .75rem; }
  .kb-lk-cfg label { display: flex; flex-direction: column; gap: 2px; min-width: 9rem; }
  .kb-lk-add { position: relative; flex: 1; min-width: 11rem; max-width: 18rem; }
  .kb-lk-hint { margin: 0 0 .5rem; }
  .kb-lk-tpl { padding-bottom: .5rem; margin-top: .25rem; }
  .kb-tf { border: 1px dashed transparent; border-radius: 4px; padding: .25rem .375rem 0; margin-bottom: .25rem; background: #fff; container-type: inline-size; container-name: blk; }
  .kb-tf:hover { border-color: var(--border-default-grey, #bbb); }
  .kb-tf > :not(.kb-blk-bar):not(.kb-opts) { pointer-events: none; }
  .kb-tf-end { border: 1px dashed var(--border-default-grey, #bbb); border-radius: 4px; color: var(--text-mention-grey, #888); font-size: .8125rem; text-align: center; padding: .375rem; margin: .25rem 0 .5rem; background: #fff; }
  .kb-tf-end.drop-over { background: var(--background-alt-blue-france, #f5f5fe); border-color: var(--text-action-high-blue-france, #000091); }
  .kb-section.kb-collapsed .kb-lk-body { display: none; }
  .kb-toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: #3a3a3a; color: #fff;
              padding: .5rem 1rem; border-radius: 4px; z-index: 60; display: none; font-size: .875rem; }
  .kb-toast.err { background: #ce0500; }
</style>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<header class="kb-bar">
  <h1 class="kb-title" id="kbTitle">Kanban</h1>
  <div class="kb-spacer"></div>
  <input class="fr-input fr-input--sm" type="search" id="kbSearch" placeholder="Rechercher une carte…" aria-label="Rechercher">
  <button class="fr-btn fr-btn--tertiary fr-btn--sm fr-icon-refresh-line" data-act="refresh" title="Recharger la structure">Recharger</button>
  <button class="fr-btn fr-btn--secondary fr-btn--sm fr-icon-settings-5-line fr-btn--icon-left kb-owner-only kb-hidden" data-act="settings">Configurer</button>
</header>
<main class="kb-board" id="kbBoard"></main>
<div class="kb-overlay" id="kbOverlay"></div>
<aside class="kb-drawer" id="kbDrawer" aria-label="Configuration"></aside>
<div class="kb-toast" id="kbToast"></div>

<script>
/* ------------------------------------------------------------------ *
 * Mode démo : si le widget est ouvert hors de Grist, on simule l'API
 * ------------------------------------------------------------------ */
const IN_GRIST = typeof grist !== 'undefined' && window.parent !== window;
/* En mode démo, ?role=owners|editors|viewers|error|probe-owner|probe-other simule la réponse de l'API Grist pour tester la détection du rôle */
const DEMO_ROLE = !IN_GRIST ? new URLSearchParams(location.search).get('role') : null;
if (!IN_GRIST) {
  const mockRows = [
    { id: 1, Titre: 'Cadrer le besoin utilisateur', Statut: 'À faire', Responsable: 1, Echeance: 1793923200, Priorite: 'Haute', Tags: ['L', 'Discovery', 'UX'], Description: 'Atelier avec les agents.', Avancement: 0.35, Budget: 12500.5, Solde: -1234.56, Valide: true, Actif: false, Lien: 'Spécifications https://example.org/spec', Cree: ['D', 1793923200, 'Pacific/Tahiti'], Fichiers: ['L', 1], Equipe: ['L', 2, 3] },
    { id: 2, Titre: 'Rédiger la note de cadrage', Statut: 'En cours', Responsable: 2, Echeance: 1794528000, Priorite: 'Moyenne', Tags: ['L', 'Doc'], Description: '' },
    { id: 3, Titre: 'Prototype du tableau de bord', Statut: 'En cours', Responsable: 1, Echeance: 1795132800, Priorite: 'Haute', Tags: ['L', 'UX'], Description: 'Version Grist.' },
    { id: 4, Titre: 'Valider avec la DNUM', Statut: 'Terminé', Responsable: 3, Echeance: 1792713600, Priorite: 'Basse', Tags: ['L'], Description: '' },
    { id: 5, Titre: 'Carte sans statut', Statut: '', Responsable: 0, Echeance: null, Priorite: '', Tags: ['L'], Description: '' },
  ];
  const people = { id: [1, 2, 3], Nom: ['Camille Durand', 'Sami Benali', 'Inès Martin'], Service: [1, 2, 1] };
  const services = { id: [1, 2], Nom: ['Produit', 'Données'] };

async function accessViaRest() {
  const docId = [document.referrer, location.href].map((s) => {
    const m = s && (s.match(/\/o\/[^/]+\/([a-zA-Z0-9_-]{6,})(?:\/|$)/) || s.match(/\/doc\/([a-zA-Z0-9_-]{6,})/));
    return m ? m[1] : null;

  let origin = null; try { origin = new URL(document.referrer).origin; } catch (e) {}
  if (!docId || !origin) return null;
  try {
    const r = await fetch(`${origin}/api/docs/${docId}`, { credentials: 'include' });
    if (r.ok) { const d = await r.json(); return d && typeof d.access === 'string' ? d.access : null; }
  } catch (e) {}
  return null;
}
async function accessViaToken() {
  try {
    const t = await grist.getAccessToken({ readOnly: false });   // un jeton « lecture seule » ramènerait le rôle à « lecteur »
    const q = '?auth=' + encodeURIComponent(t.token);
    const res = await fetch(t.baseUrl + q);
    if (res.ok) { const d = await res.json(); if (d && typeof d.access === 'string') return d.access; }
    const probe = await fetch(t.baseUrl + '/usersForViewAs' + q);   // adresse accessible aux seuls propriétaires
    if (probe.ok) return 'owners';
  } catch (e) {}
  return null;
}

    return 'non-owner';

}

  try { if (typeof grist.getUserSession === 'function') { const s = await grist.getUserSession(); acc = s && s.access ? s.access : null; } } catch (e) {}
  if (!acc) acc = await accessViaRest();

      <select class="fr-select" data-cfg="titleCol">${opt(meta.cols, cfg.titleCol)}</select></section>
    <section><h3>Champs sous le titre</h3>
      ${rows('card', cfg.cardFields)}
      <select class="fr-select" data-cfg="addCard" aria-label="Ajouter un champ à la carte"><option value="">+ Ajouter un champ…</option>${opt(freeCard, '')}</select>
      <p class="fr-hint-text" style="margin-top:.5rem">Glissez la poignée ⠿ pour réordonner. L’affichage suit le type du champ : pastille pour les choix et références, icône pour les dates, texte sinon. Le titre du champ s’affiche au-dessus de sa valeur.</p></section>
    <section><h3>Fenêtre de détail</h3>
      <p class="fr-hint-text">La mise en page (champs, titres, sections, séparateurs, largeurs, options de chaque champ) se règle directement dans la fenêtre : cliquez sur une carte, puis sur « Mise en page ».</p>
      <label class="fr-label" for="kbEditMethod" style="margin-top:.75rem">Modification des données</label>
      <select class="fr-select" id="kbEditMethod" data-cfg="editMethod">
        <option value="button" ${cfg.editMethod !== 'direct' ? 'selected' : ''}>Via le bouton « Modifier »</option>
        <option value="direct" ${cfg.editMethod === 'direct' ? 'selected' : ''}>Directement dans les champs</option></select></section>`;
}
function openSettings() { if (!isOwner) return; renderDrawer(); $('#kbDrawer').classList.add('open'); }

/* ------------------------------------------------------------------ *
 * Événements
 * ------------------------------------------------------------------ */
document.addEventListener('click', async (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) {
    if (e.target.closest('a.kb-link')) return;                 // un lien s'ouvre sans ouvrir la carte
    const card = e.target.closest('.kb-card');
    if (card) openModal(Number(card.dataset.id));
    else if (e.target === $('#kbOverlay')) closeModal();
    return;
  }
  const i = Number(a.dataset.i), idx = Number(a.dataset.idx);
  switch (a.dataset.act) {
    case 'settings': openSettings(); break;
    case 'closeSettings': $('#kbDrawer').classList.remove('open'); break;
    case 'close': closeModal(); break;
    case 'save': saveModal(); break;
    case 'refresh': await loadMeta(); await loadLinked(true); normRecords(); renderBoard(); renderDrawer(); toast('Structure rechargée'); break;
    case 'rm': cfg.cardFields.splice(i, 1); persist(); break;
    /* popup : mode mise en page */
    case 'editLayout': enterLayout(); break;
    case 'doneLayout': editLayout = false; renderModal(); break;
    case 'toggleSec': { const k = a.dataset.key; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); renderModal(); break; }
    case 'secFold': { const b = blocks()[i]; if (b) { b.fold = !b.fold; if (!b.fold) delete b.closed; saveLayout(); } break; }
    case 'secClosed': { const b = blocks()[i]; if (b) { b.closed = !b.closed; saveLayout(); } break; }
    case 'editData': editing = true; renderModal(); break;
    case 'cancelEdit': pending = {}; editing = false; if (cfg.editMethod === 'direct') closeModal(); else renderModal(); break;
    case 'dd': { const d = a.closest('.kb-dd'), open = d.classList.contains('kb-open'); document.querySelectorAll('.kb-dd.kb-open').forEach((n) => n.classList.remove('kb-open')); if (!open) d.classList.add('kb-open'); break; }
    case 'pick': setPending(a.dataset.col, a.dataset.v); renderModal(); break;
    case 'addCl': setPending(a.dataset.col, ['L', ...asList(curVal(a.dataset.col)).map(String), a.dataset.v]); renderModal(); break;
    case 'rmCl': setPending(a.dataset.col, ['L', ...asList(curVal(a.dataset.col)).map(String).filter((v) => v !== a.dataset.v)]); renderModal(); break;
    case 'addRef': { const c = col(a.dataset.col), id = Number(a.dataset.v); setPending(c.colId, c.base === 'RefList' ? ['L', ...refIds(curVal(c.colId)), id] : id); renderModal(); break; }
    case 'rmRef': { const c = col(a.dataset.col), id = Number(a.dataset.v); const rest = refIds(curVal(c.colId)).filter((x) => x !== id); setPending(c.colId, c.base === 'RefList' ? ['L', ...rest] : 0); renderModal(); break; }
    case 'attDl': downloadAtt(Number(a.dataset.v)); break;
    case 'attRm': { const id = Number(a.dataset.v); setPending(a.dataset.col, ['L', ...refIds(curVal(a.dataset.col)).filter((x) => x !== id)]); renderModal(); break; }
    case 'attAdd': { const inp = a.parentElement.querySelector('input[type=file]'); if (inp) inp.click(); break; }
    case 'blkOpt': optIdx = optIdx === i ? null : i; renderModal(); break;
    case 'setEmoji': { const b = blocks()[i]; if (b) { b.emoji = a.dataset.v; saveCfg(); renderModal(); } break; }
    case 'setTag': { const b = blocks()[i]; if (b) { b.tag = a.dataset.v; saveCfg(); renderModal(); } break; }
    case 'blkRm': blocks().splice(i, 1); tfOpen = null; saveLayout(); break;
    case 'addBlk': { let spec; try { spec = JSON.parse(a.dataset.spec); } catch (x) { break; } blocks().push(newBlock(spec)); palSearch = ''; saveLayout(); break; }
    /* bloc « Table liée » : champs du modèle */
    case 'tfAdd': { const b = blocks()[i], base = b && b.lk && tableMeta(b.lk.table).by[a.dataset.v]; if (base) { (b.fields = b.fields || []).push({ col: base.colId, w: defaultWidth(base) }); saveLayout(); } break; }
    case 'tfRm': { const b = blocks()[i]; if (b && b.fields) { b.fields.splice(Number(a.dataset.fi), 1); tfOpen = null; saveLayout(); } break; }
    case 'tfOpt': { const k = i + ':' + a.dataset.fi; tfOpen = tfOpen === k ? null : k; renderModal(); break; }
    case 'tfEmoji': { const f = ((blocks()[i] || {}).fields || [])[Number(a.dataset.fi)]; if (f) { f.emoji = a.dataset.v; saveCfg(); renderModal(); } break; }
    case 'tfTag': { const f = ((blocks()[i] || {}).fields || [])[Number(a.dataset.fi)]; if (f) { f.tag = a.dataset.v; saveCfg(); renderModal(); } break; }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.blk === 'text') {          // texte d'un titre / d'une section (popup) : pas de nouveau rendu, on garde le focus
    const b = blocks()[Number(t.dataset.i)];
    if (b) { b.text = t.value; saveCfg(); }
    return;
  }
  const k = t.dataset && t.dataset.cfg; if (!k) return;
  if (k === 'groupCol') cfg.groupCol = t.value || null;
  else if (k === 'titleCol') cfg.titleCol = t.value;
  else if (k === 'editMethod') { cfg.editMethod = t.value === 'direct' ? 'direct' : 'button'; if (modalId !== null) renderModal(); }
  else if (k === 'addCard') { if (t.value) cfg.cardFields.push({ col: t.value }); }
  persist();
});
/* champs de la popup : saisie, listes déroulantes, pièces jointes */
const setPending = (colId, v) => { pending[colId] = v; };
document.addEventListener('input', (e) => {
  const t = e.target, f = t.dataset && t.dataset.f; if (f === undefined) { if (t.dataset && t.dataset.refsearch !== undefined) {
    const c = col(t.dataset.refsearch), b = blockForKey(c.colId), list = t.parentElement.querySelector('.kb-dd-list');
    if (list) list.innerHTML = refOptions(c, b, t.value);
  } return; }
  const k = t.dataset.kind;
  if (k === 'text') { setPending(f, t.value); if (t.classList.contains('kb-auto')) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; } }
  else if (k === 'num') {
    if (t.value === '') return setPending(f, null);
    const n = parseFloat(t.value); if (isNaN(n)) return;
    setPending(f, t.dataset.pct ? +(n / 100).toPrecision(12) : n);
  }
});
document.addEventListener('change', (e) => {
  const t = e.target, d = t.dataset || {};
  if (d.lk) {                                              // réglages d'un bloc « Table liée »
    const b = blocks()[Number(d.i)]; if (!b || !b.lk) return;
    if (d.lk === 'rel') {
      const [tb, rc] = t.value.split('|');
      if (tb !== b.lk.table || rc !== b.lk.refCol) { b.lk = { table: tb, refCol: rc, titleCol: defaultTitleCol(tb, rc), sortCol: '' }; b.fields = []; tfOpen = null; }
    } else b.lk[d.lk] = t.value;
    saveLayout(); return;
  }
  if (d.twsel !== undefined) { const [bi, fi] = d.twsel.split(':').map(Number), f = ((blocks()[bi] || {}).fields || [])[fi]; if (f) { f.w = t.value; saveLayout(); } return; }
  if (d.topt) {                                            // option d'un champ du modèle
    const f = ((blocks()[Number(d.bi)] || {}).fields || [])[Number(d.fi)]; if (!f) return;
    const v = t.type === 'checkbox' ? t.checked : t.value.trim();
    if (v === '' || v === false) delete f[d.topt]; else f[d.topt] = v;
    saveCfg(); if (t.type === 'checkbox' || t.tagName === 'SELECT') renderModal();
    return;
  }
  if (d.opt) {                                            // option d'un champ (mode mise en page)
    const b = blocks()[Number(d.i)]; if (!b) return;
    const v = t.type === 'checkbox' ? t.checked : t.value.trim();
    if (v === '' || v === false) delete b[d.opt]; else b[d.opt] = v;
    saveCfg(); if (t.type === 'checkbox' || t.tagName === 'SELECT') renderModal();     // les champs texte ne sont pas redessinés : on garde le focus
    return;
  }
  if (d.wsel !== undefined) { const b = blocks()[Number(d.wsel)]; if (b) { b.w = t.value; saveLayout(); } return; }
  if (d.attfile !== undefined) { uploadFiles(d.attfile, t.files); return; }
  if (d.f === undefined) return;
  if (d.kind === 'date') setPending(d.f, t.value ? Date.parse(t.value + 'T00:00:00Z') / 1000 : null);
  else if (d.kind === 'datetime') setPending(d.f, t.value ? localToSec(t.value, d.tz) : null);
  else if (t.type === 'checkbox') setPending(d.f, t.checked);
});
async function uploadFiles(colId, files) {
  if (!files || !files.length) return;
  try {
    const ids = [];
    for (const f of files) ids.push(await grist.docApi.uploadAttachment(f));
    setPending(colId, ['L', ...refIds(curVal(colId)), ...ids]); renderModal(); toast(ids.length + ' fichier(s) ajouté(s)');
  } catch (e) { toast('Ajout impossible : ' + (e.message || e), true); }
}
document.addEventListener('mousedown', (e) => { if (e.target.closest && e.target.closest('.kb-ref .kb-dd-item')) e.preventDefault(); });   // garde le focus dans la recherche
document.addEventListener('click', (e) => { if (!e.target.closest('.kb-dd')) document.querySelectorAll('.kb-dd.kb-open').forEach((n) => n.classList.remove('kb-open')); });
$('#kbSearch').addEventListener('input', (e) => { search = e.target.value.trim().toLowerCase(); renderBoard(); });
/* recherche d'un champ : la liste de résultats s'affiche sous le champ (pas de nouveau rendu de la fenêtre : on garde le focus) */
function showPop(t) {
  if (t.dataset.blk === 'search') { palSearch = t.value; openPop(t.parentElement.querySelector('.kb-pop'), palItems(palSearch)); }
  else if (t.dataset.lkadd !== undefined) openPop(t.parentElement.querySelector('.kb-pop'), lkAddItems(Number(t.dataset.lkadd), t.value));
}
document.addEventListener('input', (e) => { if (e.target.dataset && (e.target.dataset.blk === 'search' || e.target.dataset.lkadd !== undefined)) showPop(e.target); });
document.addEventListener('focusin', (e) => { if (e.target.dataset && (e.target.dataset.blk === 'search' || e.target.dataset.lkadd !== undefined)) showPop(e.target); });
document.addEventListener('click', (e) => { if (!e.target.closest('.kb-pal-find, .kb-lk-add')) closePops(); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const t = e.target;
  if (t && t.dataset && (t.dataset.blk === 'search' || t.dataset.lkadd !== undefined) && t.value) { t.value = ''; palSearch = ''; closePops(); return; }   // Échap efface d'abord la recherche
  if (document.querySelector('.kb-pop.open')) { closePops(); return; }
  closeModal(); $('#kbDrawer').classList.remove('open');
});

/* Réordonnancement des champs (panneau de configuration) : on ne peut saisir une ligne que par sa poignée */
let rdrag = null;   // { list: 'card' | 'modal', i, target?: { i, after } }
const MARKS = ['row-dragging', 'drop-before', 'drop-after', 'drop-left', 'drop-right', 'drop-over'];
const clearRowMarks = () => document.querySelectorAll(MARKS.map((m) => '.' + m).join(',')).forEach((n) => n.classList.remove(...MARKS));
const resetGrips = () => document.querySelectorAll('.kb-row[draggable=true],.kb-blk[draggable=true],.kb-tf[draggable=true]').forEach((n) => (n.draggable = false));
document.addEventListener('mousedown', (e) => {
  const g = e.target.closest && e.target.closest('.kb-grip, .kb-blk-kind');     // poignée ou libellé de la barre
  const host = g && g.closest('.kb-row, .kb-tf, .kb-blk');
  if (host) host.draggable = true;
});
document.addEventListener('mouseup', resetGrips);
document.addEventListener('dragstart', (e) => {
  /* popup : élément de la palette ou bloc saisi par sa poignée */
  const chip = e.target.closest && e.target.closest('.kb-chip, .kb-pop-item[data-spec]');
  const tf = !chip && e.target.closest && e.target.closest('.kb-tf');
  const blk = !chip && !tf && e.target.closest && e.target.closest('.kb-blk');
  if (chip || tf || blk) {
    if (chip) { try { mdrag = { kind: 'new', spec: JSON.parse(chip.dataset.spec) }; } catch (x) { return; } setTimeout(closePops, 0); }
    else if (tf) {
      const host = tf.closest('.kb-lkblk');
      mdrag = { kind: 'tf', bi: Number(host.dataset.i), from: Number(tf.dataset.fi) };
      tf.classList.add('row-dragging');
    } else {
      const i = Number(blk.dataset.i), b = blocks()[i];
      mdrag = isSection(b) ? { kind: 'section', from: i, to: secEnd(i) } : { kind: 'block', from: i };
      blk.classList.add('row-dragging');
    }
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'bloc'); } catch (x) {}
    return;
  }
  const row = e.target.closest && e.target.closest('.kb-row');
  if (row) {
    rdrag = { list: row.dataset.list, i: Number(row.dataset.i) };
    row.classList.add('row-dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'field'); } catch (x) {}
    return;
  }
  const card = e.target.closest && e.target.closest('.kb-card'); if (!card) return;
  drag = { id: Number(card.dataset.id), from: Number(card.dataset.idx) };
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(drag.id)); } catch (x) {}
});
document.addEventListener('dragend', () => {
  drag = null; rdrag = null; mdrag = null; clearRowMarks(); resetGrips(); closePops();
  document.querySelectorAll('.dragging,.drag-over').forEach((n) => n.classList.remove('dragging', 'drag-over'));
});
document.addEventListener('dragover', (e) => {
  if (mdrag && mdrag.kind === 'tf') {                  // réordonner les champs du modèle d'un bloc « Table liée »
    const keep = document.querySelector('.kb-tf.row-dragging');
    clearRowMarks(); if (keep) keep.classList.add('row-dragging');
    mdrag.pos = undefined;
    const host = e.target.closest && e.target.closest('.kb-lkblk');
    if (!host || Number(host.dataset.i) !== mdrag.bi) return;
    const el = nearestTarget(e, host, '.kb-tf, .kb-tf-end');
    if (!el) return;
    const fi = Number(el.dataset.fi), r = el.getBoundingClientRect();
    let pos, side;
    if (el.classList.contains('kb-tf-end')) { pos = fi; side = 'over'; }
    else {
      const f = blocks()[mdrag.bi].fields[fi], half = f.w !== 'full', after = half ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
      pos = fi + (after ? 1 : 0); side = half ? (after ? 'right' : 'left') : (after ? 'after' : 'before');
    }
    e.preventDefault(); mdrag.pos = pos;
    el.classList.add(({ before: 'drop-before', after: 'drop-after', left: 'drop-left', right: 'drop-right', over: 'drop-over' })[side]);
    return;
  }
  if (mdrag) {
    const t = dropTarget(e);
    const keep = mdrag.kind === 'block' || mdrag.kind === 'section' ? document.querySelector('.kb-blk.row-dragging') : null;
    clearRowMarks(); if (keep) keep.classList.add('row-dragging');
    mdrag.pos = undefined;
    if (!t || !validPos(t.pos)) return;
    e.preventDefault();
    mdrag.pos = t.pos;
    t.el.classList.add(({ before: 'drop-before', after: 'drop-after', left: 'drop-left', right: 'drop-right', over: 'drop-over' })[t.side]);
    return;
  }
  if (rdrag) {
    const row = e.target.closest && e.target.closest('.kb-row');
    if (!row || row.dataset.list !== rdrag.list) return;
    e.preventDefault();
    const r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    clearRowMarks();
    document.querySelectorAll('.kb-row').forEach((n) => { if (n.dataset.list === rdrag.list && Number(n.dataset.i) === rdrag.i) n.classList.add('row-dragging'); });
    row.classList.add(after ? 'drop-after' : 'drop-before');
    rdrag.target = { i: Number(row.dataset.i), after };
    return;
  }
  const body = e.target.closest && e.target.closest('.kb-col'); if (!body || !drag) return;
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach((n) => n.classList.remove('drag-over'));
  body.querySelector('.kb-col-body').classList.add('drag-over');
});
document.addEventListener('drop', (e) => {
  if (mdrag) {
    e.preventDefault();
    const m = mdrag; mdrag = null; clearRowMarks(); resetGrips();
    if (m.pos !== undefined) applyDrop(m);
    return;
  }
  if (rdrag) {
    e.preventDefault();
    const { list: name, i: from, target } = rdrag;
    rdrag = null; clearRowMarks();
    const list = name === 'modal' ? cfg.modalFields : cfg.cardFields;
    if (!list || !target) return;
    let to = target.i + (target.after ? 1 : 0);
    if (from < to) to--;
    if (to !== from) { const [it] = list.splice(from, 1); list.splice(to, 0, it); persist(); }
    return;
  }
  const colEl = e.target.closest && e.target.closest('.kb-col'); if (!colEl || !drag) return;
  e.preventDefault();
  const { id, from } = drag; drag = null;
  moveCard(id, from, Number(colEl.dataset.idx));
});

/* ------------------------------------------------------------------ *
 * Démarrage
 * ------------------------------------------------------------------ */
/* Par défaut Grist renvoie le libellé des références, pas leur identifiant : on demande les identifiants
   (expandRefs: false) et, par sécurité, on retraduit un éventuel libellé en identifiant. */
function refIdOf(c, v) {
  if (Array.isArray(v) && v[0] === 'R') v = v[2];        // forme codée ['R', table, identifiant ou libellé]
  if (typeof v === 'number' || v == null || v === '') return v;
  const hit = (refs[c.colId]?.rows || []).find((x) => x.label === v);
  return hit ? hit.id : v;
}
function normRecords() {
  const rc = meta.cols.filter((c) => c.base === 'Ref' || c.base === 'RefList');
  if (!rc.length) return;
  records.forEach((r) => rc.forEach((c) => {
    const v = r[c.colId];
    if (c.base === 'Ref') r[c.colId] = refIdOf(c, v);
    else if (Array.isArray(v)) r[c.colId] = ['L', ...asList(v).map((x) => refIdOf(c, x))];
  }));
}

grist.ready({ requiredAccess: 'full', onEditOptions: openSettings });
detectOwner().then((acc) => { accessLevel = acc; isOwner = acc === 'owners'; applyRole(); });
grist.onOptions((o) => {
  const c = (o && o.cfg) || {};
  if (sentCfg.includes(JSON.stringify(c))) return;       // écho de notre propre enregistrement
  cfg = { groupCol: c.groupCol || cfg.groupCol, titleCol: c.titleCol || cfg.titleCol, cardFields: c.cardFields || cfg.cardFields,
          modalFields: c.modalFields || cfg.modalFields, editMethod: c.editMethod || cfg.editMethod };
  renderBoard();
});
/* onRecords sert à savoir QUELLES lignes afficher (filtres, liens entre widgets) et à être prévenu des changements.
   Les valeurs, elles, sont relues en brut (identifiants, dates en nombre, listes ['L', …]) : c'est le seul format
   fiable, quelle que soit la version de Grist. */
let loadSeq = 0;
async function loadRecords(rows) {
  const seq = ++loadSeq;
  let raw = null;
  try { raw = await grist.docApi.fetchTable(meta.tableId || await grist.getTable().getTableId()); } catch (e) {}
  if (seq !== loadSeq) return;                           // une mise à jour plus récente est arrivée entre-temps
  if (raw && Array.isArray(raw.id)) {
    const idx = new Map(raw.id.map((id, i) => [id, i]));
    const keys = Object.keys(raw).filter((k) => k !== 'id');
    records = rows.map((row) => {
      const i = idx.get(row.id);
      if (i === undefined) return row;
      const rec = { id: row.id };
      keys.forEach((k) => { rec[k] = raw[k][i]; });
      return rec;
    });
  } else records = rows;
  normRecords();
  renderBoard();
  if (modalId !== null && !records.some((r) => r.id === modalId)) closeModal();
  else if (modalId !== null) refreshLinkedOpen();
}
grist.onRecords((rows) => { loadRecords(rows); }, { includeColumns: 'shown', keepEncoded: true, expandRefs: false, format: 'rows' });
renderBoard();
loadMeta().then(() => {
  if (!cfg.cardFields.length) {
    cfg.cardFields = meta.cols.filter((c) => c.colId !== cfg.titleCol && c.colId !== cfg.groupCol && ['Date', 'Choice', 'Ref'].includes(c.base)).slice(0, 3)
      .map((c) => ({ col: c.colId }));
  }
  if (!cfg.modalFields) cfg.modalFields = cfg.cardFields.map((f) => ({ col: f.col, w: defaultWidth(col(f.col)) }));
  normRecords();
  renderBoard(); renderDrawer();
  loadLinked().then(() => { if (modalId !== null && !Object.keys(pending).length) renderModal(); });
}).catch((e) => { $('#kbBoard').innerHTML = `<div class="kb-empty"><p>Impossible de lire la structure de la table.</p><p class="fr-hint-text">${esc(e.message || e)}<br>Vérifiez que le widget a l’accès « Accès complet au document ».</p></div>`; });
</script>
